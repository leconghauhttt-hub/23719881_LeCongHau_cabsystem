
openapi: 3.0.3
info:
  title: CAB System API - Nền tảng đặt xe trực tuyến (Công ty ABC)
  description: |
    Tài liệu đặc tả API chuẩn OpenAPI 3.0 cho môn Lập trình Hướng dịch vụ (SOA / Microservices) - IUH.
    Được phân tích và ánh xạ trực tiếp từ 30 Yêu cầu Chức năng (FR01 - FR30) trong tài liệu SRS.
    Người thực hiện: Le Cong Hau
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Cổng Local Docker API Gateway

paths:
  # =========================================================================
  # 1. AUTHENTICATION SERVICE (FR01, FR02)
  # =========================================================================
  /auth/register:
    post:
      tags:
        - Authentication Service
      summary: Khách hàng đăng ký tài khoản (FR01)
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - phone
                - email
                - password
              properties:
                full_name:
                  type: string
                  example: Nguyễn Văn A
                phone:
                  type: string
                  example: "0901234567"
                email:
                  type: string
                  format: email
                  example: customera@gmail.com
                password:
                  type: string
                  format: password
                  example: Password@123
      responses:
        '201':
          description: Đăng ký tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /auth/login:
    post:
      tags:
        - Authentication Service
      summary: Khách hàng / Tài xế / Vận hành đăng nhập (FR02)
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Email hoặc Số điện thoại
                  example: "0901234567"
                password:
                  type: string
                  format: password
                  example: Password@123
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: Bearer
                  role:
                    type: string
                    enum: [CUSTOMER, DRIVER, OPERATION_STAFF]
                    example: CUSTOMER
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # =========================================================================
  # 2. CUSTOMER SERVICE (FR04, FR29)
  # =========================================================================
  /customers/profile:
    put:
      tags:
        - Customer Service
      summary: Cập nhật thông tin cá nhân khách hàng (FR04)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: Nguyễn Văn B
                email:
                  type: string
                  example: nguyenvanb@gmail.com
      responses:
        '200':
          description: Cập nhật hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /customers/trips:
    get:
      tags:
        - Customer Service
      summary: Khách hàng xem lịch sử chuyến đi (FR29)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lấy danh sách lịch sử chuyến đi thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 12
                  trips:
                    type: array
                    items:
                      $ref: '#/components/schemas/TripResponse'

  # =========================================================================
  # 3. DRIVER & LOCATION SERVICE (FR05, FR06, FR16)
  # =========================================================================
  /drivers/profile:
    put:
      tags:
        - Driver Service
      summary: Tài xế cập nhật hồ sơ và phương tiện (FR05)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: Trần Văn C
                license_number:
                  type: string
                  example: B2-12345678
                vehicle:
                  type: object
                  properties:
                    plate_number:
                      type: string
                      example: 59A-123.45
                    vehicle_type:
                      type: string
                      enum: [4_SEATS, 7_SEATS, MOTORBIKE]
                      example: 4_SEATS
                    model:
                      type: string
                      example: Toyota Vios 2022
      responses:
        '200':
          description: Cập nhật thông tin thành công
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /drivers/status:
    patch:
      tags:
        - Driver Service
      summary: Chuyển đổi trạng thái sẵn sàng nhận chuyến / ngừng hoạt động (FR06)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [AVAILABLE, OFFLINE, BUSY]
                  example: AVAILABLE
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /drivers/location:
    post:
      tags:
        - Driver Service
      summary: Gửi toạ độ GPS thời gian thực phục vụ Matching (FR16)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: number
                  format: float
                  example: 10.822159
                lng:
                  type: number
                  format: float
                  example: 106.686844
      responses:
        '200':
          description: Lưu vị trí GPS thành công

  # =========================================================================
  # 4. TRIP & MATCHING SERVICE (FR07, FR08, FR09, FR10, FR11, FR12, FR13, FR14, FR15)
  # =========================================================================
  /trips:
    post:
      tags:
        - Trip Service
      summary: Khách hàng gửi yêu cầu đặt xe (FR07, FR08, FR09, FR10, FR11)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup_location
                - dropoff_location
                - vehicle_type
              properties:
                pickup_location:
                  type: string
                  example: 12 Nguyễn Văn Bảo, Gò Vấp, TP.HCM
                dropoff_location:
                  type: string
                  example: Sân bay Tân Sơn Nhất, Tân Bình, TP.HCM
                vehicle_type:
                  type: string
                  enum: [4_SEATS, 7_SEATS, MOTORBIKE]
                  example: 4_SEATS
      responses:
        '201':
          description: Đã tạo yêu cầu chuyến xe, bắt đầu tìm kiếm tài xế (SEARCHING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /trips/{trip_id}:
    get:
      tags:
        - Trip Service
      summary: Khách hàng theo dõi trạng thái chuyến đi theo thời gian thực (FR14)
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thông tin chi tiết chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /trips/{trip_id}/respond:
    post:
      tags:
        - Trip Service
      summary: Tài xế chấp nhận hoặc từ chối đề xuất chuyến (FR11, FR12, FR13)
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [ACCEPT, REJECT]
                  example: ACCEPT
      responses:
        '200':
          description: Phản hồi chuyến được ghi nhận. Nếu REJECT, hệ thống tự động tìm tài xế khác (FR12).
        '400':
          $ref: '#/components/responses/BadRequestError'

  /trips/{trip_id}/status:
    patch:
      tags:
        - Trip Service
      summary: Tài xế cập nhật trạng thái chuyến đi theo tiến trình (FR15)
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ARRIVED_AT_PICKUP, PICKED_UP, IN_TRANSIT, COMPLETED]
                  example: ARRIVED_AT_PICKUP
      responses:
        '200':
          description: Cập nhật trạng thái chuyến đi thành công
        '400':
          $ref: '#/components/responses/BadRequestError'

  # =========================================================================
  # 5. BILLING & PAYMENT SERVICE (FR17, FR18, FR19, FR20)
  # =========================================================================
  /trips/{trip_id}/fare:
    get:
      tags:
        - Payment Service
      summary: Hệ thống tính toán cước chuyến đi (FR17)
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết cước chuyến đi
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip_id:
                    type: string
                  distance_km:
                    type: number
                    example: 6.5
                  base_fare:
                    type: number
                    example: 20000
                  total_amount:
                    type: number
                    example: 85000

  /payments/checkout:
    post:
      tags:
        - Payment Service
      summary: Khách hàng chọn phương thức & thực hiện thanh toán (FR18, FR19, FR20)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - method
              properties:
                trip_id:
                  type: string
                  example: trip-12345
                method:
                  type: string
                  enum: [CASH, ONLINE]
                  example: ONLINE
      responses:
        '200':
          description: Xử lý thanh toán hoàn tất hoặc chuyển hướng sang cổng thanh toán thứ 3
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_id:
                    type: string
                    example: pay-98765
                  status:
                    type: string
                    enum: [SUCCESS, FAILED, PENDING]
                    example: SUCCESS
                  payment_url:
                    type: string
                    description: Đường dẫn thanh toán bên thứ 3 nếu chọn ONLINE
                    example: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?...
        '400':
          $ref: '#/components/responses/BadRequestError'

  # =========================================================================
  # 6. RATING SERVICE (FR30)
  # =========================================================================
  /trips/{trip_id}/rating:
    post:
      tags:
        - Rating Service
      summary: Khách hàng đánh giá tài xế sau chuyến đi (FR30)
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - score
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: Tài xế lái xe cẩn thận, nhiệt tình!
      responses:
        '201':
          description: Gửi đánh giá thành công
        '400':
          $ref: '#/components/responses/BadRequestError'

  # =========================================================================
  # 7. NOTIFICATION SERVICE (FR21, FR22)
  # =========================================================================
  /notifications:
    get:
      tags:
        - Notification Service
      summary: Lấy danh sách thông báo của người dùng (FR21, FR22)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'

  # =========================================================================
  # 8. OPERATION & ADMIN SERVICE (FR03, FR23, FR24, FR25, FR26, FR27)
  # =========================================================================
  /admin/drivers:
    post:
      tags:
        - Operation & Admin Service
      summary: Nhân viên vận hành tạo tài khoản cho tài xế (FR03)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - phone
                - license_number
              properties:
                full_name:
                  type: string
                  example: Lê Văn Tài
                phone:
                  type: string
                  example: "0912345678"
                license_number:
                  type: string
                  example: C-98765432
      responses:
        '201':
          description: Đã tạo tài khoản tài xế thành công
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/users/{user_id}/status:
    patch:
      tags:
        - Operation & Admin Service
      summary: Quản lý khóa/mở khóa tài khoản khách hàng và tài xế (FR24, FR27)
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, LOCKED]
                  example: LOCKED
      responses:
        '200':
          description: Cập nhật trạng thái người dùng thành công
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/trips/live:
    get:
      tags:
        - Operation & Admin Service
      summary: Giám sát danh sách các chuyến xe đang diễn ra (FR23)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách chuyến xe thời gian thực
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/trips/{trip_id}/resolve:
    post:
      tags:
        - Operation & Admin Service
      summary: Nhân viên can thiệp xử lý chuyến xe gặp sự cố (FR25)
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution_note
                - action
              properties:
                resolution_note:
                  type: string
                  example: Tài xế hỏng xe giữa đường, chuyển chuyến xe cho tài xế khác.
                action:
                  type: string
                  enum: [CANCEL_TRIP, REASSIGN_DRIVER]
                  example: CANCEL_TRIP
      responses:
        '200':
          description: Đã xử lý sự cố và lưu vết nhật ký vận hành (Audit Log)
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/payments/history:
    get:
      tags:
        - Operation & Admin Service
      summary: Tra cứu lịch sử giao dịch thanh toán hệ thống (FR26)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    payment_id:
                      type: string
                    trip_id:
                      type: string
                    amount:
                      type: number
                    method:
                      type: string
                    status:
                      type: string
                    paid_at:
                      type: string
                      format: date-time
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # =========================================================================
  # 9. REPORT SERVICE (FR28)
  # =========================================================================
  /admin/reports/summary:
    get:
      tags:
        - Report Service
      summary: Báo cáo số chuyến, doanh thu, tỷ lệ hoàn thành/hủy (FR28)
      security:
        - BearerAuth: []
      parameters:
        - name: from_date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-09-01"
        - name: to_date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-09-30"
      responses:
        '200':
          description: Báo cáo số liệu vận hành chi tiết
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_trips:
                    type: integer
                    example: 1250
                  completed_trips:
                    type: integer
                    example: 1180
                  cancelled_trips:
                    type: integer
                    example: 70
                  total_revenue:
                    type: number
                    example: 85000000
                  completion_rate:
                    type: string
                    example: "94.4%"

# =========================================================================
# COMPONENTS (SCHEMAS & RESPONSES DÙNG CHUNG)
# =========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CustomerResponse:
      type: object
      properties:
        customer_id:
          type: string
          example: cus-001
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          example: customera@gmail.com
        created_at:
          type: string
          format: date-time

    TripResponse:
      type: object
      properties:
        trip_id:
          type: string
          example: trip-8888
        customer_id:
          type: string
          example: cus-001
        driver_id:
          type: string
          nullable: true
          example: drv-9999
        pickup_location:
          type: string
          example: 12 Nguyễn Văn Bảo, Gò Vấp, TP.HCM
        dropoff_location:
          type: string
          example: Sân bay Tân Sơn Nhất, Tân Bình, TP.HCM
        vehicle_type:
          type: string
          example: 4_SEATS
        status:
          type: string
          enum: [SEARCHING, DRIVER_ASSIGNED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: SEARCHING
        requested_at:
          type: string
          format: date-time

    NotificationResponse:
      type: object
      properties:
        notification_id:
          type: string
          example: notif-01
        recipient_id:
          type: string
          example: cus-001
        type:
          type: string
          example: DRIVER_FOUND
        message:
          type: string
          example: Tài xế đang đến điểm đón của bạn!
        sent_at:
          type: string
          format: date-time

    ErrorModel:
      type: object
      properties:
        error_code:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ hoặc thiếu trường bắt buộc

  responses:
    BadRequestError:
      description: Dữ liệu yêu cầu không hợp lệ (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    UnauthorizedError:
      description: Chưa xác thực hoặc Token hết hạn (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    ForbiddenError:
      description: Không có quyền truy cập vào tài nguyên quản trị (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    NotFoundError:
      description: Không tìm thấy tài nguyên (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'

openapi: 3.0.3
info:
  title: CAB System - Auth Service API
  description: Quản lý đăng ký tài khoản khách hàng và đăng nhập hệ thống.
  version: 1.0.0
servers:
  - url: http://localhost:8081/api/v1
paths:
  /auth/register:
    post:
      tags: [Auth Service]
      summary: Khách hàng đăng ký tài khoản (FR01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, phone, email, password]
              properties:
                full_name: { type: string, example: "Nguyễn Văn A" }
                phone: { type: string, example: "0901234567" }
                email: { type: string, format: email, example: "customera@gmail.com" }
                password: { type: string, format: password, example: "Password@123" }
      responses:
        '201':
          description: Đăng ký thành công
        '400':
          description: Dữ liệu không hợp lệ
  /auth/login:
    post:
      tags: [Auth Service]
      summary: Đăng nhập hệ thống (FR02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "0901234567" }
                password: { type: string, example: "Password@123" }
      responses:
        '200':
          description: Đăng nhập thành công, trả JWT Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string, example: "eyJhbGciOiJIUzI1Ni..." }
                  token_type: { type: string, example: "Bearer" }
                  role: { type: string, enum: [CUSTOMER, DRIVER, OPERATION_STAFF] }
        '401':
          description: Sai thông tin đăng nhập
